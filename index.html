<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Крестики-нолики вдвоём</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Тетрадный лист в клетку: синяя ручка играет крестиками, красная ноликами. */
:root{
  --paper:#f6f8f2; --grid:#cfdcec; --card:#ffffff; --ink:#1c2942; --muted:#5c6982;
  --x:#1f4fd1; --o:#d2333d; --line:#1c2942; --win:#fff1a8;
  --display:"Caveat","Segoe Script","Comic Sans MS",cursive;
  --body:"Golos Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131a29; --grid:#22304a; --card:#1b2439; --ink:#e7ecf6; --muted:#95a2ba;
    --x:#7fa8ff; --o:#ff7d86; --line:#c9d3e6; --win:#4a4420; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; padding:20px 16px 40px;
}
.page{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin:0}
h1 .x{color:var(--x)} h1 .o{color:var(--o)}
.sub{margin:0;color:var(--muted);font-size:14px}

.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.side.turn{box-shadow:4px 4px 0 var(--line)}
.side .mark{font-family:var(--display);font-size:30px;line-height:1;font-weight:700}
.side.sx .mark,.side.sx .num{color:var(--x)}
.side.so .mark,.side.so .num{color:var(--o)}
.side .num{font-family:var(--display);font-size:46px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.side .who{font-size:13px;color:var(--muted)}
.side.so{text-align:right;align-items:flex-end}
.draws{display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--muted);font-size:12px;padding:0 4px}
.draws b{font-family:var(--display);font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:600;font-size:15px}
.btn:hover{box-shadow:3px 3px 0 var(--line);transform:translate(-1px,-1px)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500;font-size:14px;padding:8px 6px;text-decoration:underline}
.btn.ghost:hover{box-shadow:none;transform:none;color:var(--ink)}
:focus-visible{outline:3px solid var(--x);outline-offset:2px}

.invite{background:var(--card);border:2px dashed var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.invite p{margin:0;font-size:14px}
.invite .row{flex-wrap:nowrap}
.invite input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:8px 10px}

.timer{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border:2px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--x);transition:width .25s linear}
.timer.o .bar i{background:var(--o)}
.timer.low .secs{color:var(--o)}
.secs{font-family:var(--display);font-size:32px;line-height:1;font-weight:700;min-width:2.4ch;text-align:right;font-variant-numeric:tabular-nums}
.timer.idle .bar i{width:0}

.board{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.cell{aspect-ratio:1;border:0;background:transparent;padding:10%;border-right:3px solid var(--line);border-bottom:3px solid var(--line);display:block;min-width:0}
.cell:nth-child(3n){border-right:0}
.cell:nth-child(n+7){border-bottom:0}
.cell[disabled]{cursor:default}
.cell.can:hover{background:var(--grid)}
.cell.win{background:var(--win)}
.cell svg{width:100%;height:100%;display:block}
.cell svg *{fill:none;stroke-width:11;stroke-linecap:round}
.cell.vx svg *{stroke:var(--x)} .cell.vo svg *{stroke:var(--o)}
.cell.fresh svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .28s ease-out forwards}
.cell.fresh svg *:nth-child(2){animation-delay:.16s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.cell.fresh svg *{animation:none;stroke-dashoffset:0}.bar i{transition:none}.btn:hover{transform:none}}

.status{font-family:var(--display);font-size:30px;line-height:1.1;font-weight:700;margin:0;min-height:34px}
.note{margin:0;font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.limits{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[disabled]{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1><span class="x">Крестики</span>-<span class="o">нолики</span></h1>
    <p class="sub">Игра на двоих по одной ссылке. Раунд № <span id="round">1</span></p>
  </header>

  <section class="invite" id="invite" hidden>
    <p>Отправьте эту ссылку второму игроку. Игра начнётся, как только он её откроет.</p>
    <div class="row">
      <input id="link" readonly aria-label="Ссылка на игру">
      <button class="btn" id="copy" type="button">Скопировать</button>
    </div>
  </section>

  <section class="score" aria-label="Счёт">
    <div class="side sx" id="sideX">
      <span class="mark">X</span>
      <span class="num" id="scoreX">0</span>
      <span class="who" id="whoX"></span>
    </div>
    <div class="draws"><b id="scoreD">0</b>ничьи</div>
    <div class="side so" id="sideO">
      <span class="mark">O</span>
      <span class="num" id="scoreO">0</span>
      <span class="who" id="whoO"></span>
    </div>
  </section>

  <div class="timer idle" id="timer" aria-label="Время на ход">
    <div class="bar"><i id="barFill"></i></div>
    <span class="secs" id="secs">–</span>
  </div>

  <div class="board" id="board" aria-label="Игровое поле"></div>

  <p class="status" id="status" aria-live="polite">Подключаюсь…</p>
  <p class="note" id="note" hidden></p>

  <div class="row">
    <button class="btn" id="next" type="button" hidden>Следующий раунд</button>
  </div>

  <div class="limits">
    <span>Время на ход:</span>
    <button class="chip" id="lim15" type="button">15 с</button>
    <button class="chip" id="lim30" type="button">30 с</button>
    <button class="chip" id="lim60" type="button">60 с</button>
  </div>

  <div class="row">
    <button class="btn ghost" id="zero" type="button">Обнулить счёт</button>
    <button class="btn ghost" id="newgame" type="button">Новая игра с новой ссылкой</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var SVG = {
    X:'<svg viewBox="0 0 100 100" aria-hidden="true"><path pathLength="1" d="M22 22 L78 78"/><path pathLength="1" d="M78 22 L22 78"/></svg>',
    O:'<svg viewBox="0 0 100 100" aria-hidden="true"><circle pathLength="1" cx="50" cy="50" r="30"/></svg>'
  };
  function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

  // Комната живёт в адресе после #. Кто создал комнату, тот хозяин и играет за X.
  var room = location.hash.slice(1).replace(/[^a-z0-9]/gi, '');
  var isHost;
  if(!room){
    room = Math.random().toString(36).slice(2, 10);
    store('ttt-host-' + room, '1');
    history.replaceState(null, '', '#' + room);
    isHost = true;
  } else {
    isHost = store('ttt-host-' + room) === '1';
  }
  var me = isHost ? 'X' : 'O';
  var PEER_ID = 'ttt-game-' + room;

  var s = null;            // состояние игры (у хозяина оно главное)
  var deadline = 0;        // когда истекает ход, по местным часам
  var pausedLeft = 0;      // сколько оставалось на ход, пока соперник не в сети
  var connected = false, conn = null, peer = null, problem = '';
  var prevBoard = null, hostTries = 0;

  function fresh(){
    return {board:['','','','','','','','',''], turn:'X', starter:'X', status:'waiting',
            winner:null, line:null, reason:null, limit:30, score:{X:0,O:0,D:0}, round:1};
  }
  function winLine(b){
    for(var i=0;i<LINES.length;i++){ var l=LINES[i]; if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[1]]===b[l[2]]) return l; }
    return null;
  }

  /* ---------- логика хозяина ---------- */
  function startTurn(){ deadline = Date.now() + s.limit*1000; pausedLeft = s.limit*1000; }
  function broadcast(){
    var left = connected ? deadline - Date.now() : pausedLeft;
    store('ttt-state-' + room, JSON.stringify({s:s, left:left}));
    if(conn && conn.open){ try{ conn.send({t:'state', s:s, left:left}); }catch(e){} }
    render();
  }
  function handle(who, m){
    if(!s || !m) return;
    if(m.t === 'move'){
      var i = m.i|0;
      if(s.status !== 'playing' || !connected || s.turn !== who || i < 0 || i > 8 || s.board[i]) return;
      s.board[i] = who;
      var line = winLine(s.board);
      if(line){ s.status='over'; s.winner=who; s.line=line; s.reason='line'; s.score[who]++; }
      else if(s.board.every(Boolean)){ s.status='over'; s.winner='D'; s.reason='draw'; s.score.D++; }
      else { s.turn = who === 'X' ? 'O' : 'X'; startTurn(); }
    } else if(m.t === 'next'){
      if(s.status !== 'over') return;
      var st = s.starter === 'X' ? 'O' : 'X';
      s.board = fresh().board; s.starter = st; s.turn = st; s.winner = null; s.line = null; s.reason = null;
      s.round++; s.status = 'playing'; startTurn();
    } else if(m.t === 'limit'){
      if(s.status === 'playing' || [15,30,60].indexOf(m.l) < 0) return;
      s.limit = m.l;
    } else if(m.t === 'zero'){
      s.score = {X:0,O:0,D:0}; s.round = 1;
    } else return;
    broadcast();
  }
  function act(m){
    if(isHost) handle('X', m);
    else if(conn && conn.open){ try{ conn.send(m); }catch(e){} }
  }

  function hostStart(){
    var saved = null;
    try{ saved = JSON.parse(store('ttt-state-' + room) || 'null'); }catch(e){}
    if(saved && saved.s && Array.isArray(saved.s.board)){ s = saved.s; pausedLeft = Math.max(0, saved.left || 0); }
    else { s = fresh(); }
    render();
    openHostPeer();
  }
  function openHostPeer(){
    peer = new Peer(PEER_ID);
    peer.on('open', function(){ problem = ''; render(); });
    peer.on('connection', function(c){
      c.on('open', function(){
        if(conn && conn !== c){ try{ conn.close(); }catch(e){} }
        conn = c; connected = true;
        if(s.status === 'waiting'){ s.status = 'playing'; s.turn = s.starter; startTurn(); }
        else if(s.status === 'playing'){ deadline = Date.now() + pausedLeft; }
        broadcast();
      });
      c.on('data', function(m){ if(c === conn) handle('O', m); });
      c.on('close', function(){
        if(c !== conn) return;
        if(s.status === 'playing') pausedLeft = Math.max(0, deadline - Date.now());
        connected = false; conn = null; broadcast();
      });
    });
    peer.on('disconnected', function(){ if(!peer.destroyed){ try{ peer.reconnect(); }catch(e){} } });
    peer.on('error', function(e){
      if(e && e.type === 'unavailable-id'){
        // после перезагрузки страницы старое подключение ещё может числиться занятым
        if(hostTries++ < 8){ try{ peer.destroy(); }catch(x){} setTimeout(openHostPeer, 2000); }
        else { problem = 'Эта игра уже открыта в другой вкладке. Закройте её или начните новую игру.'; render(); }
      } else if(e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error')){
        problem = 'Нет связи с сервером соединений. Проверьте интернет и обновите страницу.'; render();
      }
    });
  }

  /* ---------- логика гостя ---------- */
  function guestStart(){
    render();
    peer = new Peer();
    peer.on('open', guestConnect);
    peer.on('disconnected', function(){ if(!peer.destroyed){ try{ peer.reconnect(); }catch(e){} } });
    peer.on('error', function(e){
      if(e && e.type === 'peer-unavailable'){
        problem = 'Создатель игры сейчас не в сети. Жду, когда он откроет страницу…';
        render(); setTimeout(guestConnect, 3000);
      } else if(e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error')){
        problem = 'Нет связи с сервером соединений. Проверьте интернет и обновите страницу.'; render();
      }
    });
  }
  function guestConnect(){
    if(connected || !peer || peer.destroyed || peer.disconnected) return;
    var c = peer.connect(PEER_ID, {reliable:true});
    c.on('open', function(){ conn = c; });
    c.on('data', function(m){
      if(!m || m.t !== 'state') return;
      s = m.s; connected = true; problem = '';
      deadline = Date.now() + (m.left || 0);
      render();
    });
    c.on('close', function(){
      if(conn === c){ conn = null; }
      connected = false; problem = 'Связь с соперником потеряна, подключаюсь заново…';
      render(); setTimeout(guestConnect, 2000);
    });
  }

  /* ---------- таймер ---------- */
  function tick(){
    var t = $('timer');
    if(!s || s.status !== 'playing'){ t.className = 'timer idle'; $('secs').textContent = '–'; return; }
    var left = connected ? deadline - Date.now() : (isHost ? pausedLeft : Math.max(0, deadline - Date.now()));
    if(!connected && !isHost) deadline += 250; // у гостя время стоит, пока нет связи
    var shown = Math.max(0, Math.ceil(left/1000));
    $('secs').textContent = shown;
    $('barFill').style.width = Math.max(0, Math.min(100, left/(s.limit*10))) + '%';
    t.className = 'timer' + (s.turn === 'O' ? ' o' : '') + (shown <= 5 ? ' low' : '');
    if(isHost && connected && left <= 0){
      var w = s.turn === 'X' ? 'O' : 'X';
      s.status = 'over'; s.winner = w; s.line = null; s.reason = 'timeout'; s.score[w]++;
      broadcast();
    }
  }
  setInterval(tick, 250);

  /* ---------- отрисовка ---------- */
  var cells = [];
  (function(){
    var b = $('board');
    for(var i=0;i<9;i++){
      var c = document.createElement('button');
      c.className = 'cell'; c.id = 'cell' + i; c.type = 'button'; c.disabled = true;
      (function(i){ c.addEventListener('click', function(){ act({t:'move', i:i}); }); })(i);
      b.appendChild(c); cells.push(c);
    }
  })();

  function render(){
    $('whoX').textContent = isHost ? 'вы' : 'соперник';
    $('whoO').textContent = isHost ? 'соперник' : 'вы';
    $('invite').hidden = !(isHost && s && s.status === 'waiting');
    $('link').value = location.href;

    var st = '', note = problem;
    if(!s){ st = 'Подключаюсь…'; }
    else {
      $('round').textContent = s.round;
      $('scoreX').textContent = s.score.X; $('scoreO').textContent = s.score.O; $('scoreD').textContent = s.score.D;
      var live = s.status === 'playing' && connected;
      $('sideX').classList.toggle('turn', live && s.turn === 'X');
      $('sideO').classList.toggle('turn', live && s.turn === 'O');
      var myTurn = live && s.turn === me;
      for(var i=0;i<9;i++){
        var v = s.board[i], c = cells[i];
        if(c.dataset.v !== v){
          c.dataset.v = v; c.innerHTML = v ? SVG[v] : '';
          c.classList.toggle('vx', v === 'X'); c.classList.toggle('vo', v === 'O');
          c.classList.toggle('fresh', !!v && !!prevBoard);
        }
        c.classList.toggle('win', !!(s.line && s.line.indexOf(i) >= 0));
        c.classList.toggle('can', myTurn && !v);
        c.disabled = !(myTurn && !v);
        c.setAttribute('aria-label', 'Клетка ' + (i+1) + (v ? ': ' + v : ': пусто'));
      }
      prevBoard = s.board;

      if(s.status === 'waiting'){ st = 'Ждём соперника'; }
      else if(s.status === 'playing'){
        if(!connected){ st = 'Соперник не в сети'; if(!note) note = 'Таймер на паузе. Игра продолжится, когда соперник снова откроет ссылку.'; }
        else st = myTurn ? 'Ваш ход' : 'Ход соперника';
      } else {
        st = s.winner === 'D' ? 'Ничья' : s.winner === me ? 'Вы победили' : 'Вы проиграли';
        if(s.reason === 'timeout' && !note) note = s.winner === me ? 'У соперника вышло время на ход.' : 'У вас вышло время на ход.';
      }
      $('next').hidden = !(s.status === 'over' && connected);
      [15,30,60].forEach(function(l){
        var b = $('lim' + l);
        b.setAttribute('aria-pressed', String(s.limit === l));
        b.disabled = s.limit !== l && (s.status === 'playing' || (!isHost && !connected));
      });
    }
    $('status').textContent = st;
    $('note').hidden = !note; $('note').textContent = note;
    tick();
  }

  /* ---------- кнопки ---------- */
  $('next').addEventListener('click', function(){ act({t:'next'}); });
  [15,30,60].forEach(function(l){ $('lim' + l).addEventListener('click', function(){ act({t:'limit', l:l}); }); });

  var armed = null, armTimer = 0;
  function twoStep(btn, fn){
    if(armed === btn){ clearTimeout(armTimer); armed = null; btn.textContent = btn.dataset.label; fn(); return; }
    if(armed) armed.textContent = armed.dataset.label;
    armed = btn; btn.dataset.label = btn.dataset.label || btn.textContent; btn.textContent = 'Точно? Нажмите ещё раз';
    armTimer = setTimeout(function(){ if(armed === btn){ btn.textContent = btn.dataset.label; armed = null; } }, 4000);
  }
  $('zero').addEventListener('click', function(){ twoStep(this, function(){ act({t:'zero'}); }); });
  $('newgame').addEventListener('click', function(){
    twoStep(this, function(){ location.href = location.pathname + location.search; });
  });
  $('copy').addEventListener('click', function(){
    var b = this, input = $('link');
    function done(){ b.textContent = 'Скопировано'; setTimeout(function(){ b.textContent = 'Скопировать'; }, 2000); }
    function fallback(){ input.focus(); input.select(); try{ document.execCommand('copy'); done(); }catch(e){} }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done, fallback);
    else fallback();
  });
  window.addEventListener('hashchange', function(){ location.reload(); });

  if(typeof Peer === 'undefined'){
    $('status').textContent = 'Игра не загрузилась';
    $('note').hidden = false; $('note').textContent = 'Не удалось загрузить библиотеку соединения. Проверьте интернет и обновите страницу.';
    return;
  }
  if(isHost) hostStart(); else guestStart();
})();
</script>
</body>
</html>
